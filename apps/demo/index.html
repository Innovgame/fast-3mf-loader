<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Browser-first TypeScript 3MF parsing with WebWorkers and a Three.js builder. Try local model previews, explore the API, and check support boundaries."
        />
        <meta name="theme-color" content="#edf1f7" />
        <meta property="og:title" content="fast-3mf-loader — Browser-first 3MF parsing" />
        <meta
            property="og:description"
            content="Parse 3MF models in the browser. Typed model data, WebWorker parallelism, and Three.js scene building."
        />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://innovgame.github.io/fast-3mf-loader/" />
        <link rel="canonical" href="https://innovgame.github.io/fast-3mf-loader/" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <title>fast-3mf-loader — Browser-first 3MF parsing</title>
        <script>
            try {
                const stored = localStorage.getItem("fast3mf-theme");
                document.documentElement.dataset.theme =
                    stored === "dark" || stored === "light" ? stored : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            } catch {
                /* Preference storage is optional. */
            }
        </script>
    </head>
    <body>
        <div id="app"></div>
        <noscript>This page needs JavaScript for model previews. Visit https://github.com/Innovgame/fast-3mf-loader for documentation.</noscript>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
